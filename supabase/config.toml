# Supabase CLI project config. Set project_id when linking: `supabase link`.
# https://supabase.com/docs/guides/cli/config

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.ingest-signals]
# Cron has no user JWT; the x-ingest-secret shared secret is the gate.
verify_jwt = false
